name: hamino_app
description: "Hamino Workout - Chuyên biệt cho Calisthenics"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Core & State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  uuid: ^4.3.3
  intl: ^0.19.0

  # Local Storage & Database
  sqflite: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2

  # Audio & Hardware
  flutter_tts: ^4.1.0
  audioplayers: 6.8.1
  audio_session: ^0.1.18
  wakelock_plus: ^1.1.4

  # UI & Utilities
  google_fonts: ^6.1.0
  flutter_local_notifications: ^17.0.0

  flutter_native_splash: ^2.4.8

  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/hamino_logo.png"
  adaptive_icon_background: "assets/icons/background.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"

flutter_native_splash:
  color: "#000000"
  image: assets/icons/splash.png

  android: true
  ios: true

  android_12:
    color: "#000000"
    image: assets/icons/splash.png

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/icons/
